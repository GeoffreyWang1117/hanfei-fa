[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merkle-weight-verify"
version = "0.2.0"
description = "ML model weight verification via hierarchical Merkle trees — O(1) integrity check, layer-aware diff, incremental sync. The missing verification layer for safetensors, PyTorch, and HuggingFace Hub."
authors = [{name = "Geoffrey Wang", email = "geoffreywang1117@gmail.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["merkle-tree", "integrity", "verification", "model-weights", "hashing", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
merkle-verify = "merkle_verify.cli:main"

[project.optional-dependencies]
fast = ["blake3>=1.0.0"]
safetensors = ["safetensors>=0.4.0"]
torch = ["torch>=2.0.0"]
huggingface = ["safetensors>=0.4.0", "huggingface_hub>=0.20.0"]
all = ["blake3>=1.0.0", "safetensors>=0.4.0", "torch>=2.0.0", "huggingface_hub>=0.20.0"]

[project.urls]
Homepage = "https://github.com/GeoffreyWang1117/merkle-weight-verify"
Issues = "https://github.com/GeoffreyWang1117/merkle-weight-verify/issues"

[tool.setuptools.packages.find]
include = ["merkle_verify*"]
